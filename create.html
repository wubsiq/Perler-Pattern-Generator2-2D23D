<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开始做图 · 拼豆图纸</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/create.css">
</head>

<body class="create">

    <header class="topbar">
        <a class="topbar-brand" href="index.html">
            <span class="brand-mark">拼</span>
            <span>拼豆图纸</span>
        </a>
        <div class="topbar-spacer"></div>
        <button class="btn btn-ghost btn-sm" id="btnReset" hidden>重新开始</button>
    </header>

    <main class="create-main">

        <!-- ========== 入口 ========== -->
        <section class="entry" id="entryView">
            <div class="entry-head">
                <h1>从哪开始？</h1>
                <p>导入一张图片自动走完处理流程，或者直接从空白画布开始画</p>
            </div>

            <div class="entry-actions">
                <button class="entry-card" id="btnBlank" type="button">
                    <span class="entry-icon" aria-hidden="true">
                        <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
                            <rect x="3" y="3" width="7.2" height="7.2" rx="1.6" stroke="currentColor" stroke-width="1.6" />
                            <rect x="13.8" y="3" width="7.2" height="7.2" rx="1.6" stroke="currentColor" stroke-width="1.6" opacity=".35" />
                            <rect x="3" y="13.8" width="7.2" height="7.2" rx="1.6" stroke="currentColor" stroke-width="1.6" opacity=".35" />
                            <rect x="13.8" y="13.8" width="7.2" height="7.2" rx="1.6" stroke="currentColor" stroke-width="1.6" opacity=".35" />
                        </svg>
                    </span>
                    <span class="entry-title">空白画布</span>
                    <span class="entry-desc">从零开始，自己定尺寸和配色</span>
                </button>

                <button class="entry-card entry-card-primary" id="btnImport" type="button">
                    <span class="entry-icon" aria-hidden="true">
                        <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
                            <rect x="3" y="4.5" width="18" height="15" rx="2.4" stroke="currentColor" stroke-width="1.6" />
                            <circle cx="8.6" cy="10" r="1.9" stroke="currentColor" stroke-width="1.6" />
                            <path d="M3.6 16.8l4.5-4.2 3.4 3 3-2.6 5.9 4.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </span>
                    <span class="entry-title">图片导入</span>
                    <span class="entry-desc">拖进来，或点击选择文件</span>
                </button>
            </div>

            <p class="entry-hint">
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M8 1.6a6.4 6.4 0 100 12.8A6.4 6.4 0 008 1.6zM8 7.2v4M8 4.9v.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
                </svg>
                图片只在你的浏览器里处理，不会上传
            </p>
        </section>

        <!-- ========== 三步处理 ========== -->
        <section class="flow" id="flowView" hidden>
            <nav class="flow-steps" id="flowSteps" aria-label="处理步骤">
                <span class="flow-step" data-step="1"><b>1</b>裁切旋转</span>
                <span class="flow-step-sep" aria-hidden="true"></span>
                <span class="flow-step" data-step="2"><b>2</b>像素化</span>
                <span class="flow-step-sep" aria-hidden="true"></span>
                <span class="flow-step" data-step="3"><b>3</b>拼豆化</span>
            </nav>

            <div class="t-window">
                <div class="t-top">
                    <section class="t-pane">
                        <header class="pane-head">
                            <span class="pane-title" id="leftTitle">原图</span>
                            <span class="pane-meta" id="leftMeta"></span>
                        </header>
                        <div class="pane-body" id="leftBody"></div>
                    </section>

                    <section class="t-pane t-pane-preview">
                        <header class="pane-head">
                            <span class="pane-title" id="rightTitle">预览</span>
                            <span class="pane-meta" id="rightMeta"></span>
                        </header>
                        <div class="pane-body" id="rightBody"></div>
                    </section>
                </div>

                <div class="t-bottom">
                    <div class="t-controls" id="controls"></div>
                    <div class="t-foot">
                        <span class="t-status" id="flowStatus"></span>
                        <button class="btn" id="btnBack" type="button">上一步</button>
                        <button class="btn btn-primary" id="btnNext" type="button">下一步</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 拖拽遮罩 -->
        <div class="drop-overlay" id="dropOverlay" hidden>
            <div class="drop-inner">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 15.4V4.2M7.4 8.6L12 4l4.6 4.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M4 15v3.2A2.8 2.8 0 006.8 21h10.4A2.8 2.8 0 0020 18.2V15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
                </svg>
                <strong>松手就导入</strong>
                <span>支持 JPG / PNG / WebP</span>
            </div>
        </div>
    </main>

    <input type="file" id="fileInput" accept="image/*" hidden>

    <!-- 核心算法复用 v1（纯函数，未改动） -->
    <script src="js/colors.js"></script>
    <script src="js/colorUtils.js"></script>
    <script src="js/create.js"></script>
</body>

</html>
